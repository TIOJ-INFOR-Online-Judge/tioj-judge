name: CI tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  tests:
    name: tioj-judge CI Tests
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install dependencies
        # runner is amd64v3 which mise PPA does not provide natively
        run: |
          sudo apt update -y
          sudo apt install -y \
            software-properties-common git g++ cmake ninja-build curl \
            libseccomp-dev libnl-genl-3-dev libsqlite3-dev libbsd-dev libgmp-dev \
            libz-dev libbz2-dev libreadline-dev libssl-dev libboost-all-dev libzstd-dev \
            libjitterentropy3-dev
          sudo add-apt-repository -y ppa:jdxcode/mise
          sudo sed -i '/^Types:/a Architectures: amd64' /etc/apt/sources.list.d/jdxcode-ubuntu-mise-resolute.sources
          sudo apt update -y
          sudo apt install -y mise
          mise plugin add ghc
          mise install ghc@9.10 || mise install ghc@9.10
          mise install python@2.7 python@3.14 rust@1.93

      - name: Environment setup
        run: |
          echo "PATH=$HOME/.local/share/mise/installs/rust/1.93:$HOME/.local/share/mise/installs/python/3.14/bin:$HOME/.local/share/mise/installs/python/2.7/bin:$HOME/.local/share/mise/installs/ghc/9.10/bin:$PATH" >> $GITHUB_ENV
          echo "TIOJ_JUDGE_MOUNTS=$HOME/.local/share/mise:$HOME/.cargo:$HOME/.rustup" >> $GITHUB_ENV
          echo "CARGO_HOME=$HOME/.cargo" >> $GITHUB_ENV
          echo "RUSTUP_HOME=$HOME/.rustup" >> $GITHUB_ENV

      - name: Python package install
        run: |
          pip3 install numpy~=2.5.0 Pillow~=13.0.0

      - name: Compile
        run: |
          cmake -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -B build -G Ninja
          cmake --build build

      - name: Run tests
        run: |
          sudo env "PATH=$PATH" "TIOJ_JUDGE_MOUNTS=$TIOJ_JUDGE_MOUNTS" \
            "CARGO_HOME=$CARGO_HOME" "RUSTUP_HOME=$RUSTUP_HOME" \
            ./build/judge-test
